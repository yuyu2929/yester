[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yester"
version = "0.1.1"
description = "A time machine for every folder you own — local-first, Git-powered file versioning."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yester contributors" }]
keywords = ["git", "versioning", "backup", "local-first", "time-machine", "notes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
]
dependencies = [
    "watchdog>=3.0",
    "cryptography>=41.0",
    "PyYAML>=6.0",
    "Flask>=2.2",
    "Markdown>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/yuyu2929/yester"
Documentation = "https://github.com/yuyu2929/yester#readme"
Issues = "https://github.com/yuyu2929/yester/issues"

[project.scripts]
yester = "yester.cli:main"

[tool.setuptools.packages.find]
include = ["yester*"]

[tool.setuptools.package-data]
yester = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
